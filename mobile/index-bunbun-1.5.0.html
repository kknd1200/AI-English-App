function commonOverride(text,from,to){const pair=COMMON_OVERRIDES[from+'>'+to];if(!pair)return null;const key=String(text||'').trim().replace(/[.!?。！？]+$/g,'').trim();const hit=pair[key];return hit?{text:hit[0],read:hit[1]||''}:null}

function offlineNormalize(text){let t=String(text||'');try{t=t.normalize('NFKC')}catch(e){}return t.toLowerCase().trim().replace(/[.!?。！？,，、~～]+$/g,'').replace(/\s+/g,' ')}let OFFLINE_INDEX=null;function getOfflineIndex(){if(OFFLINE_INDEX)return OFFLINE_INDEX;const idx={ko:{},vi:{},en:{},ja:{}};BOOK.forEach(cat=>cat.items.forEach(p=>{const vals={ko:p.ko,vi:p.vi,en:p.en,ja:p.ja};Object.keys(vals).forEach(lang=>{const v=vals[lang];if(!v)return;idx[lang][offlineNormalize(v)]=p;if(lang==='ko'&&v.includes('/'))v.split('/').map(x=>x.trim()).filter(Boolean).forEach(x=>idx[lang][offlineNormalize(x)]=p)})}));OFFLINE_INDEX=idx;return idx}function findOfflinePhrase(text,from){const idx=getOfflineIndex();let key=offlineNormalize(text);const aliasMap=OFFLINE_ALIASES[from]||{};const alias=aliasMap[key]||aliasMap[String(text||'').trim()];if(alias)key=offlineNormalize(alias);return idx[from]&&idx[from][key]}

async function engineGoogle(text,from,to){const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+from+'&tl='+to+'&dt=t&q='+encodeURIComponent(text);const res=await fetch(url);if(!res.ok)throw new Error('google '+res.status);const j=await res.json();return(j[0]||[]).map(seg=>seg[0]).join('')}const MM_LOCALE={ko:'ko-KR',vi:'vi-VN',en:'en-US',ja:'ja-JP'};async function engineMyMemory(text,from,to){const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,480))+'&langpair='+MM_LOCALE[from]+'|'+MM_LOCALE[to]+'&mt=1';const res=await fetch(url);if(!res.ok)throw new Error('mymemory '+res.status);const j=await res.json();const out=j&&j.responseData&&j.responseData.translatedText;if(!out)throw new Error('mymemory empty');if(/MYMEMORY WARNING|QUOTA/i.test(out))throw new Error('QUOTA');return decodeHtml(out)}const FREE_ENGINES=[engineGoogle,engineMyMemory];async function translateFree(text,from,to){let quota=false,got=null;for(const engine of FREE_ENGINES){try{const out=(await engine(text,from,to)||'').trim();if(!out)continue;if(looksLike(out,to))return{text:out,read:''};got=out}catch(e){if(String(e.message)==='QUOTA')quota=true}}if(quota)throw new Error('무료 번역 하루 사용량을 초과했어요. 설정에서 OpenAI로 바꿔보세요');if(got)throw new Error('번역기가 '+LANGS[to].name+'가 아닌 엉뚱한 언어를 돌려줬어요. 다시 시도하거나 OpenAI로 바꿔보세요');throw new Error('번역 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요')}function decodeHtml(s){const d=document.createElement('textarea');d.innerHTML=s;return d.value}
