<style>
:root{--bg:#08111f;--panel:#111c31;--panel2:#1b2a46;--line:#273858;--text:#eaf2ff;--muted:#8fa1c1;--cyan:#24c8e8;--blue:#21a4df;--mine:#0d728e;--theirs:#16223b;--danger:#ff7187;--ok:#4be3a2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100dvh;display:flex;flex-direction:column}.top{background:linear-gradient(180deg,#12213a,#0e192c);border-bottom:1px solid var(--line);padding:18px 24px 14px;position:sticky;top:0;z-index:10}.brandrow{display:flex;align-items:center;gap:12px}.brand{font-size:25px;font-weight:800;letter-spacing:-.5px}.brand b{color:var(--cyan)}.spacer{flex:1}.pill,.gear{border:1px solid var(--line);background:#17243d;color:var(--text);border-radius:24px;padding:10px 18px}.pill{color:var(--cyan);font-weight:700}.gear{font-size:22px;padding:9px 14px}.langbar{display:grid;grid-template-columns:1fr 88px 1fr;gap:14px;align-items:center;margin-top:18px}.langsel{border:1px solid var(--line);background:#1a2946;color:var(--text);border-radius:24px;padding:16px 18px;font-size:26px;font-weight:800;width:100%;appearance:none;text-align:center}.swap{border:0;border-radius:50%;background:var(--blue);color:#031625;width:72px;height:72px;font-size:38px;justify-self:center}.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#121f35;border-bottom:1px solid var(--line)}.tab{padding:18px 10px;border:0;background:transparent;color:var(--muted);font-size:21px;font-weight:800;border-bottom:4px solid transparent}.tab.on{color:var(--cyan);border-color:var(--cyan)}.page{display:none;flex:1;padding:20px 24px 220px}.page.on{display:block}.chat{max-width:760px;margin:0 auto}.msg{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:30px}.msg.mine{align-items:flex-end}.tag{color:var(--muted);font-size:16px;font-weight:700;margin:0 6px 8px}.bubble{max-width:72%;border:1px solid #1c96b2;background:linear-gradient(180deg,#0b6f89,#0d7994);border-radius:28px;padding:23px 28px}.msg:not(.mine) .bubble{background:#10213a;border-color:#213755}.src{font-size:20px;color:#d8e8f7;margin-bottom:12px}.out{font-size:31px;font-weight:800;line-height:1.35;word-break:break-word}.read{margin-top:8px;color:#d1edf7;font-size:18px}.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.act{border:0;border-radius:15px;background:#111c31;color:#9caecc;padding:10px 16px;font-size:18px}.composer{position:fixed;left:0;right:0;bottom:0;background:#0f1b2f;border-top:1px solid var(--line);padding:20px 24px max(20px,env(safe-area-inset-bottom));z-index:15}.microw{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:760px;margin:0 auto 18px}.mic{border:1px solid var(--line);border-radius:28px;background:#1a2946;color:var(--text);padding:28px 12px;text-align:center}.mic.mine{background:linear-gradient(180deg,#1590a5,#0d7890);border-color:#20b8d0}.mic .ico{font-size:40px}.mic .name{font-size:27px;font-weight:800;margin-top:10px}.mic .sub{color:#99abc6;font-size:16px;margin-top:4px}.mic.mine .sub{color:#d7f2f6}.mic.rec{box-shadow:0 0 0 4px rgba(255,80,100,.25) inset;border-color:#ff6b7d}.typerow{display:grid;grid-template-columns:1fr 115px;gap:14px;max-width:760px;margin:0 auto}.typerow input{border:1px solid var(--line);border-radius:22px;background:#1a2946;color:var(--text);font-size:20px;padding:18px 22px;outline:none}.typerow input::placeholder{color:#64769a}.send{border:0;border-radius:22px;background:var(--blue);color:#031625;font-size:23px;font-weight:900}.phrase-wrap,.history-wrap{max-width:760px;margin:0 auto}.phrase-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--line);background:#15233c;color:#b9c7df;border-radius:18px;padding:10px 14px}.chip.on{border-color:var(--cyan);color:var(--cyan)}.phrase-card,.hist-card{background:#111e34;border:1px solid var(--line);border-radius:22px;padding:18px 20px;margin-bottom:14px}.phrase-ko,.hist-src{color:#a7b7d0;font-size:16px}.phrase-out,.hist-out{font-size:22px;font-weight:800;margin-top:6px}.phrase-read,.hist-read{color:#95cee0;margin-top:5px}.rowacts{display:flex;gap:8px;margin-top:12px}.small{border:0;border-radius:12px;background:#1b2a46;color:#b9c7df;padding:8px 12px}.empty{color:var(--muted);text-align:center;padding:50px 0}.status{max-width:760px;margin:0 auto;color:#90a5c7;font-size:15px;padding-top:10px;min-height:30px}.status.err{color:var(--danger)}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:50}.modalback.on{display:flex}.modal{width:100%;background:#111d31;border-top:1px solid #334766;border-radius:28px 28px 0 0;padding:25px 24px max(30px,env(safe-area-inset-bottom))}.modal h2{margin:0 0 20px}.f{margin:15px 0}.f label{display:block;color:#a8b6cc;margin-bottom:8px}.f input,.f select{width:100%;border:1px solid var(--line);background:#1b2942;color:var(--text);border-radius:15px;padding:14px 16px}.switch{display:flex;align-items:center;gap:12px}.hint{font-size:13px;color:#7285a6;margin-top:5px;line-height:1.45}.close{width:100%;margin-top:18px;border:0;border-radius:16px;background:#1ea6d9;color:#041828;padding:15px;font-weight:900}.toast{position:fixed;left:50%;bottom:235px;transform:translateX(-50%) translateY(20px);background:#202d47;color:#eef5ff;border:1px solid #35496c;border-radius:14px;padding:10px 16px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:620px){.top{padding:14px 16px 12px}.brand{font-size:21px}.pill{padding:8px 13px}.langbar{grid-template-columns:1fr 70px 1fr;gap:10px}.langsel{font-size:22px;padding:14px 12px}.swap{width:60px;height:60px;font-size:32px}.page{padding:16px 14px 215px}.bubble{max-width:80%;padding:18px 20px;border-radius:24px}.out{font-size:27px}.composer{padding:16px 14px max(16px,env(safe-area-inset-bottom))}.microw{gap:12px}.mic{padding:22px 8px}.mic .name{font-size:23px}.mic .ico{font-size:34px}.typerow{grid-template-columns:1fr 96px}.send{font-size:20px}.tab{font-size:18px;padding:16px 8px}}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brandrow">
      <div class="brand">🌏 여행 <b>통역기</b></div><div class="spacer"></div>
      <button class="pill" id="enginePill">OpenAI 서버</button><button class="gear" id="gear">⚙️</button>
    </div>
    <div class="langbar"><select class="langsel" id="mine"></select><button class="swap" id="swap">⇄</button><select class="langsel" id="theirs"></select></div>
  </header>
  <nav class="tabs"><button class="tab on" data-tab="chat">💬 대화</button><button class="tab" data-tab="phrase">📖 문장집</button><button class="tab" data-tab="history">🕘 기록</button></nav>
  <main class="page on" id="page-chat"><div class="chat" id="chat"></div><div class="status" id="status"></div></main>
  <main class="page" id="page-phrase"><div class="phrase-wrap"><div class="phrase-tools" id="phraseCats"></div><div id="phrases"></div></div></main>
  <main class="page" id="page-history"><div class="history-wrap" id="history"></div></main>
</div>
<div class="composer" id="composer"><div class="microw"><button class="mic" id="micTheirs"><div class="ico">🎤</div><div class="name" id="micTheirsName"></div><div class="sub">상대방이 말하기</div></button><button class="mic mine" id="micMine"><div class="ico">🎤</div><div class="name" id="micMineName"></div><div class="sub">내가 말하기</div></button></div><div class="typerow"><input id="typed" placeholder="직접 입력해서 번역…" enterkeyhint="send"><button class="send" id="send">번역</button></div></div>
<div class="modalback" id="modal"><div class="modal"><h2>설정</h2><div class="f"><label>번역 엔진</label><select id="engine"><option value="server">OpenAI 서버</option><option value="free">무료 번역</option></select><div class="hint">OpenAI API 키는 Vercel 서버에만 저장됩니다. 휴대폰에는 키가 저장되지 않습니다.</div></div><div class="f"><label>초대코드 (선택)</label><input id="accessCode" type="text" placeholder="설정하지 않았다면 비워두세요"><div class="hint">서버에서 ACCESS_CODE를 설정한 경우에만 입력하세요.</div></div><div class="f"><label class="switch"><input id="auto" type="checkbox"> 번역 후 자동으로 읽기</label></div><div class="f"><label class="switch"><input id="showRead" type="checkbox"> 베트남어·일본어에 한글 발음 표시</label></div><div class="f"><label>말하기 속도</label><input id="rate" type="range" min="0.6" max="1.3" step="0.1" value="1"></div><button class="close" id="close">닫기</button></div></div>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const store = { get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
try { localStorage.removeItem('key'); } catch (e) {}
const firstServerUpgrade = !store.get('serverOpenAIv1', false); if(firstServerUpgrade){store.set('engine','server');store.set('serverOpenAIv1',true)}
const LANGS = { ko:{name:'한국어',bcp:'ko-KR',flag:'🇰🇷'}, vi:{name:'Tiếng Việt',bcp:'vi-VN',flag:'🇻🇳'}, en:{name:'English',bcp:'en-US',flag:'🇺🇸'}, ja:{name:'日本語',bcp:'ja-JP',flag:'🇯🇵'} };
const SERVER = location.protocol === 'file:' ? 'https://yeohaeng-translator.vercel.app/api/translate' : '/api/translate';
const S={mine:store.get('mine','ko'),theirs:store.get('theirs','vi'),engine:(()=>store.get('engine','server')==='free'?'free':'server')(),code:store.get('code',''),auto:store.get('auto',true),showRead:store.get('showRead',true),rate:store.get('rate',1),hist:store.get('hist',[])};
const selMine=$('mine'),selTheirs=$('theirs'),chat=$('chat'),statusEl=$('status');
function renderLangs(){const opts=Object.keys(LANGS).map(k=>`<option value="${k}">${LANGS[k].flag} ${LANGS[k].name}</option>`).join('');selMine.innerHTML=opts;selTheirs.innerHTML=opts;selMine.value=S.mine;selTheirs.value=S.theirs;$('micMineName').textContent=LANGS[S.mine].name;$('micTheirsName').textContent=LANGS[S.theirs].name}renderLangs();
function saveLangs(){S.mine=selMine.value;S.theirs=selTheirs.value;if(S.mine===S.theirs){S.theirs=Object.keys(LANGS).find(k=>k!==S.mine);selTheirs.value=S.theirs}store.set('mine',S.mine);store.set('theirs',S.theirs);$('micMineName').textContent=LANGS[S.mine].name;$('micTheirsName').textContent=LANGS[S.theirs].name;renderPhrases()}
selMine.onchange=saveLangs;selTheirs.onchange=saveLangs;$('swap').onclick=()=>{const a=S.mine;S.mine=S.theirs;S.theirs=a;selMine.value=S.mine;selTheirs.value=S.theirs;saveLangs()};
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800)}function setStatus(m,e){statusEl.textContent=m||'';statusEl.className='status'+(e?' err':'')}
const COMMON_OVERRIDES={'ko>ja':{'안녕':['こんにちは','콘니치와'],'안녕하세요':['こんにちは','콘니치와'],'감사합니다':['ありがとうございます','아리가토오 고자이마스'],'고마워':['ありがとう','아리가토오'],'죄송합니다':['すみません','스미마센'],'미안해':['ごめんなさい','고멘나사이'],'네':['はい','하이'],'아니요':['いいえ','이이에'],'안녕히 가세요':['さようなら','사요오나라'],'안녕히 계세요':['さようなら','사요오나라'],'잘 가':['じゃあね','자아네']}};
function commonOverride(text,from,to){const pair=COMMON_OVERRIDES[from+'>'+to];if(!pair)return null;const key=String(text||'').trim().replace(/[.!?。！？]+$/g,'').trim();const hit=pair[key];return hit?{text:hit[0],read:hit[1]||''}:null}
function suspiciousJapanese(text){const t=String(text||'').trim();if(!t)return true;if(/^(?:ツァイチェン|ツァイジェン|ザイチェン|ザイジェン|ニーハオ|シエシエ|シェシェ|シェイシェイ)[。！!？?]?$/i.test(t))return true;if(/[见们这说语吗后发汉]/.test(t))return true;return false}
async function translate(text,from,to){const fixed=commonOverride(text,from,to);if(fixed)return fixed;if(S.engine==='server'){try{const r=await translateServer(text,from,to);if(to==='ja'&&suspiciousJapanese(r.text))throw new Error('일본어 검증 실패');return r}catch(e){if(from==='ja'||to==='ja')return translateFree(text,from,to);throw e}}return translateFree(text,from,to)}
async function translateServer(text,from,to){let res;try{res=await fetch(SERVER,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},S.code?{'X-Access-Code':S.code}:{}),body:JSON.stringify({text,from,to})})}catch(e){throw new Error('공용 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요')}let j={};try{j=await res.json()}catch(e){}if(!res.ok)throw new Error(j.error||('공용 서버 오류 ('+res.status+')'));if(!j.translation)throw new Error('번역 결과를 받지 못했어요');return{text:j.translation,read:(to==='vi'||to==='ja')?(j.reading||''):''}}
const RE_HANGUL=/[가-힣ᄀ-ᇿ㄰-㆏]/,RE_HAN=/[一-鿿㐀-䶿豈-﫿]/,RE_KANA=/[぀-ゟ゠-ヿ]/,RE_LETTER=/[A-Za-zÀ-ɏḀ-ỿ가-힣一-鿿぀-ヿ]/;
function looksLike(s,lang){const t=String(s||'').trim();if(!t)return false;if(!RE_LETTER.test(t))return true;if(lang==='ko')return RE_HANGUL.test(t)&&!RE_KANA.test(t);if(lang==='ja')return(RE_KANA.test(t)||RE_HAN.test(t))&&!RE_HANGUL.test(t);if(lang==='vi'||lang==='en')return!RE_HAN.test(t)&&!RE_KANA.test(t)&&!RE_HANGUL.test(t);return true}
async function engineGoogle(text,from,to){const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+from+'&tl='+to+'&dt=t&q='+encodeURIComponent(text);const res=await fetch(url);if(!res.ok)throw new Error('google '+res.status);const j=await res.json();return(j[0]||[]).map(seg=>seg[0]).join('')}
const MM_LOCALE={ko:'ko-KR',vi:'vi-VN',en:'en-US',ja:'ja-JP'};async function engineMyMemory(text,from,to){const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,480))+'&langpair='+MM_LOCALE[from]+'|'+MM_LOCALE[to]+'&mt=1';const res=await fetch(url);if(!res.ok)throw new Error('mymemory '+res.status);const j=await res.json();const out=j&&j.responseData&&j.responseData.translatedText;if(!out)throw new Error('mymemory empty');if(/MYMEMORY WARNING|QUOTA/i.test(out))throw new Error('QUOTA');return decodeHtml(out)}
async function translateFree(text,from,to){let quota=false,got=null;for(const engine of[engineGoogle,engineMyMemory]){try{const out=(await engine(text,from,to)||'').trim();if(!out)continue;if(looksLike(out,to))return{text:out,read:''};got=out}catch(e){if(String(e.message)==='QUOTA')quota=true}}if(quota)throw new Error('무료 번역 하루 사용량을 초과했어요. 설정에서 OpenAI로 바꿔보세요');if(got)throw new Error('번역기가 '+LANGS[to].name+'가 아닌 엉뚱한 언어를 돌려줬어요. 다시 시도하거나 OpenAI로 바꿔보세요');throw new Error('번역 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요')}
function decodeHtml(s){const d=document.createElement('textarea');d.innerHTML=s;return d.value}
const NATIVE=(()=>{try{return!!(window.AndroidBridge&&window.AndroidBridge.available())}catch(e){return false}})();let voices=[];function loadVoices(){voices=window.speechSynthesis?speechSynthesis.getVoices():[]}if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,lang){if(!text)return;if(NATIVE){try{AndroidBridge.speak(text,lang,S.rate)}catch(e){}return}if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=LANGS[lang].bcp;u.rate=S.rate;u.voice=voices.find(v=>v.lang===u.lang)||voices.find(v=>v.lang.startsWith(lang))||null;speechSynthesis.speak(u)}
let nOn=false,nBtn=null,nLang=null;function listenNative(lang,btn){if(nOn){try{AndroidBridge.stopListening()}catch(e){}return}nOn=true;nBtn=btn;nLang=lang;btn.classList.add('rec');setStatus('🎙️ '+LANGS[lang].name+'로 말하세요…');try{AndroidBridge.startListening(lang)}catch(e){nOn=false;btn.classList.remove('rec')}}
window.__native=function(raw){let m;try{m=JSON.parse(raw)}catch(e){return}if(m.type==='stt-partial')setStatus('🎙️ '+m.data);else if(m.type==='stt-result'){setStatus('');if(m.data)go(m.data,nLang)}else if(m.type==='stt-end'){if(nBtn)nBtn.classList.remove('rec');nOn=false;nBtn=null;nLang=null}else if(m.type==='stt-error'){setStatus('음성 인식 오류: '+m.data,true)}else if(m.type==='tts-missing'){const name=LANGS[m.data]?LANGS[m.data].name:m.data;setStatus(name+' 음성 데이터가 없어요. 휴대폰 TTS 음성 데이터를 설치해 주세요',true)}else if(m.type==='tts-error')setStatus('음성 읽기 오류가 발생했어요',true)};
let rec=null,recBtn=null;function listen(lang,btn){if(NATIVE){listenNative(lang,btn);return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setStatus('이 기기는 음성 인식을 지원하지 않아요',true);return}if(rec){try{rec.stop()}catch(e){}return}rec=new SR();rec.lang=LANGS[lang].bcp;rec.interimResults=true;rec.continuous=false;recBtn=btn;btn.classList.add('rec');let finalText='';setStatus('🎙️ '+LANGS[lang].name+'로 말하세요…');rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t;else interim+=t}setStatus('🎙️ '+(finalText||interim))};rec.onerror=e=>setStatus('음성 인식 오류: '+e.error,true);rec.onend=()=>{btn.classList.remove('rec');rec=null;const t=finalText.trim();if(t){setStatus('');go(t,lang)}};try{rec.start()}catch(e){btn.classList.remove('rec');rec=null}}
$('micMine').onclick=()=>listen(S.mine,$('micMine'));$('micTheirs').onclick=()=>listen(S.theirs,$('micTheirs'));
async function go(text,fromLang){const to=fromLang===S.mine?S.theirs:S.mine;const mine=fromLang===S.mine;const el=addBubble({src:text,out:'번역 중…',read:'',mine,from:fromLang,to,pending:true});setStatus('');try{const r=await translate(text,fromLang,to);S.hist.unshift({src:text,out:r.text,read:r.read,from:fromLang,to,t:Date.now(),fav:false});if(S.hist.length>300)S.hist.length=300;store.set('hist',S.hist);updateBubble(el,{src:text,out:r.text,read:r.read,mine,from:fromLang,to});if(S.auto)speak(r.text,to)}catch(err){updateBubble(el,{src:text,out:'⚠️ '+err.message,read:'',mine,from:fromLang,to,error:true});setStatus(err.message,true)}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function bubbleHTML(d){const showRead=S.showRead&&d.read&&(d.to==='vi'||d.to==='ja');return'<div class="tag">'+LANGS[d.from].flag+' → '+LANGS[d.to].flag+' '+LANGS[d.to].name+'</div><div class="bubble"><div class="src">'+esc(d.src)+'</div><div class="out">'+esc(d.out)+'</div>'+(showRead?'<div class="read">🔊 '+esc(d.read)+'</div>':'')+(d.pending||d.error?'':'<div class="acts"><button class="act" data-a="speak">🔊 듣기</button><button class="act" data-a="copy">📋 복사</button><button class="act fav" data-a="fav">☆ 저장</button></div>')+'</div>'}
function addBubble(d){if(!chat.querySelector('.msg'))chat.innerHTML='';const el=document.createElement('div');el.className='msg'+(d.mine?' mine':'');el.innerHTML=bubbleHTML(d);chat.appendChild(el);chat.scrollTop=chat.scrollHeight;bindBubble(el,d);return el}function updateBubble(el,d){el.className='msg'+(d.mine?' mine':'');el.innerHTML=bubbleHTML(d);bindBubble(el,d)}
function bindBubble(el,d){el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==='speak')speak(d.out,d.to);if(a==='copy'){navigator.clipboard?.writeText(d.out);toast('복사했어요')}if(a==='fav'){const h=S.hist.find(x=>x.t===d.t)||(S.hist.find(x=>x.src===d.src&&x.out===d.out));if(h){h.fav=!h.fav;store.set('hist',S.hist);toast(h.fav?'저장했어요':'저장을 해제했어요')}}})}
$('send').onclick=()=>{const t=$('typed').value.trim();if(t){$('typed').value='';go(t,S.mine)}};$('typed').onkeydown=e=>{if(e.key==='Enter')$('send').click()};
const PHRASES=[{cat:'기본',ko:'안녕하세요',vi:'Xin chào',r:'씬 짜오',en:'Hello',ja:'こんにちは',jr:'콘니치와'},{cat:'기본',ko:'감사합니다',vi:'Cảm ơn',r:'깜 언',en:'Thank you',ja:'ありがとうございます',jr:'아리가토오 고자이마스'},{cat:'기본',ko:'죄송합니다 / 실례합니다',vi:'Xin lỗi',r:'씬 로이',en:'Sorry / Excuse me',ja:'すみません',jr:'스미마센'},{cat:'기본',ko:'네',vi:'Vâng',r:'벙',en:'Yes',ja:'はい',jr:'하이'},{cat:'기본',ko:'아니요',vi:'Không',r:'콤',en:'No',ja:'いいえ',jr:'이이에'},{cat:'기본',ko:'안녕히 가세요',vi:'Tạm biệt',r:'땀 비엣',en:'Goodbye',ja:'さようなら',jr:'사요오나라'},{cat:'식당',ko:'메뉴판 주세요',vi:'Cho tôi xem thực đơn',r:'쪼 또이 쌤 특 던',en:'Menu, please',ja:'メニューをお願いします',jr:'메뉴우오 오네가이시마스'},{cat:'식당',ko:'이거 주세요',vi:'Cho tôi cái này',r:'쪼 또이 까이 나이',en:"I'll have this",ja:'これをお願いします',jr:'코레오 오네가이시마스'},{cat:'이동',ko:'여기로 가주세요',vi:'Cho tôi đến đây',r:'쪼 또이 덴 더이',en:'Take me here, please',ja:'ここまでお願いします',jr:'코코마데 오네가이시마스'},{cat:'이동',ko:'공항으로 가주세요',vi:'Đến sân bay',r:'덴 썬 바이',en:'To the airport, please',ja:'空港までお願いします',jr:'쿠우코오마데 오네가이시마스'},{cat:'쇼핑',ko:'이거 얼마예요?',vi:'Cái này bao nhiêu tiền?',r:'까이 나이 바오 니에우 띠엔',en:'How much is this?',ja:'これはいくらですか？',jr:'코레와 이쿠라데스카'},{cat:'호텔',ko:'예약했어요',vi:'Tôi đã đặt phòng',r:'또이 다 닷 퐁',en:'I have a reservation',ja:'予約しています',jr:'요야쿠 시테이마스'},{cat:'응급',ko:'도와주세요',vi:'Giúp tôi với',r:'줍 또이 버이',en:'Help me, please',ja:'助けてください',jr:'타스케테 쿠다사이'},{cat:'응급',ko:'화장실이 어디예요?',vi:'Nhà vệ sinh ở đâu?',r:'냐 베 씬 어 더우',en:'Where is the restroom?',ja:'トイレはどこですか？',jr:'토이레와 도코데스카'}];let phraseCat=store.get('phraseCat','기본');
function renderPhrases(){const cats=[...new Set(PHRASES.map(p=>p.cat))];$('phraseCats').innerHTML=cats.map(c=>'<button class="chip '+(c===phraseCat?'on':'')+'">'+c+'</button>').join('');[...$('phraseCats').children].forEach((b,i)=>b.onclick=()=>{phraseCat=cats[i];store.set('phraseCat',phraseCat);renderPhrases()});const target=S.theirs;const rows=PHRASES.filter(p=>p.cat===phraseCat);$('phrases').innerHTML=rows.map((p,i)=>{const t=target==='ja'?p.ja:(target==='en'?p.en:p.vi);const r=target==='ja'?p.jr:(target==='vi'?p.r:'');return'<div class="phrase-card"><div class="phrase-ko">'+esc(p.ko)+'</div><div class="phrase-out">'+esc(t)+'</div>'+(r?'<div class="phrase-read">🔊 '+esc(r)+'</div>':'')+'<div class="rowacts"><button class="small" data-i="'+i+'" data-a="speak">🔊 듣기</button><button class="small" data-i="'+i+'" data-a="copy">📋 복사</button></div></div>'}).join('');$('phrases').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const p=rows[+b.dataset.i];const t=target==='ja'?p.ja:(target==='en'?p.en:p.vi);if(b.dataset.a==='speak')speak(t,target);else{navigator.clipboard?.writeText(t);toast('복사했어요')}})}renderPhrases();
function renderHistory(){const h=$('history');if(!S.hist.length){h.innerHTML='<div class="empty">아직 번역 기록이 없어요</div>';return}h.innerHTML=S.hist.map((x,i)=>'<div class="hist-card"><div class="hist-src">'+LANGS[x.from].flag+' → '+LANGS[x.to].flag+' · '+esc(x.src)+'</div><div class="hist-out">'+esc(x.out)+'</div>'+(S.showRead&&x.read&&(x.to==='vi'||x.to==='ja')?'<div class="hist-read">🔊 '+esc(x.read)+'</div>':'')+'<div class="rowacts"><button class="small" data-i="'+i+'" data-a="speak">🔊 듣기</button><button class="small" data-i="'+i+'" data-a="fav">'+(x.fav?'★ 저장됨':'☆ 저장')+'</button><button class="small" data-i="'+i+'" data-a="del">삭제</button></div></div>').join('');h.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,x=S.hist[i];if(b.dataset.a==='speak')speak(x.out,x.to);if(b.dataset.a==='fav'){x.fav=!x.fav;store.set('hist',S.hist);renderHistory()}if(b.dataset.a==='del'){S.hist.splice(i,1);store.set('hist',S.hist);renderHistory()}})}
[...document.querySelectorAll('.tab')].forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('page-'+b.dataset.tab).classList.add('on');$('composer').style.display=b.dataset.tab==='chat'?'block':'none';if(b.dataset.tab==='history')renderHistory();if(b.dataset.tab==='phrase')renderPhrases()});
function applySettings(){S.engine=$('engine').value;S.code=$('accessCode').value.trim();S.auto=$('auto').checked;S.showRead=$('showRead').checked;S.rate=+$('rate').value;store.set('engine',S.engine);store.set('code',S.code);store.set('auto',S.auto);store.set('showRead',S.showRead);store.set('rate',S.rate);$('enginePill').textContent=S.engine==='server'?'OpenAI 서버':'무료 번역'}
$('gear').onclick=()=>{$('engine').value=S.engine;$('accessCode').value=S.code;$('auto').checked=S.auto;$('showRead').checked=S.showRead;$('rate').value=S.rate;$('modal').classList.add('on')};$('close').onclick=()=>{$('modal').classList.remove('on');applySettings()};$('modal').onclick=e=>{if(e.target===$('modal')){$('modal').classList.remove('on');applySettings()}};$('enginePill').onclick=()=>{$('gear').click()};applySettings();
if(!S.hist.length){chat.innerHTML='<div class="empty">마이크를 누르거나 문장을 입력해 통역을 시작하세요</div>'}
</script>
</body></html>
