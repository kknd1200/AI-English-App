name: Build Travel Translator APK

on:
  push:
    branches:
      - build-travel-translator-apk
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout trigger repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android wrapper project
        shell: bash
        run: |
          git clone --depth 1 https://github.com/iksanarisandi/templatehtmlview.git androidapp

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('androidapp/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('applicationId = "com.mycatatan.simple1"', 'applicationId = "com.yeohaeng.translator"')
          text = text.replace('versionCode = 1', 'versionCode = 3')
          text = text.replace('versionName = "1.0.0"', 'versionName = "1.2.0-ja"')
          gradle.write_text(text)

          manifest = Path('androidapp/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.RECORD_AUDIO' not in text:
              text = text.replace(
                  '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
                  '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
              )
          if 'android.intent.action.TTS_SERVICE' not in text:
              text = text.replace(
                  '<application',
                  '<queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n\n    <application',
                  1
              )
          text = text.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"')
          manifest.write_text(text)

          strings = Path('androidapp/app/src/main/res/values/strings.xml')
          if strings.exists():
              s = strings.read_text()
              s = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">여행 통역기</string>', s)
              strings.write_text(s)
          PY

          cp mobile/MainActivity.kt androidapp/app/src/main/java/com/mycatatan/simple1/MainActivity.kt
          mkdir -p androidapp/app/src/main/assets

          # Pull the currently deployed translator UI, then add Japanese support for this APK.
          curl -fsSL --retry 3 https://yeohaeng-translator.vercel.app/ -o androidapp/app/src/main/assets/index.html

          python3 - <<'PY'
          from pathlib import Path

          p = Path('androidapp/app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, required=True):
              global s
              if old not in s:
                  if required:
                      raise SystemExit('Patch target not found: ' + old[:80])
                  return
              s = s.replace(old, new)

          rep('<title>여행 통역기 — 베트남어 · 영어</title>', '<title>여행 통역기 — 베트남어 · 영어 · 일본어</title>', False)
          rep('베트남어에 한글 발음 표시', '베트남어·일본어에 한글 발음 표시', False)
          rep("  en: { name: 'English',    bcp: 'en-US', flag: '🇺🇸' }\n};",
              "  en: { name: 'English',    bcp: 'en-US', flag: '🇺🇸' },\n  ja: { name: '日本語',      bcp: 'ja-JP', flag: '🇯🇵' }\n};")
          rep("async function translate(text, from, to) {\n  if (S.engine === 'server') return translateServer(text, from, to);\n  return translateFree(text, from, to);\n}",
              "async function translate(text, from, to) {\n  if (S.engine === 'server') {\n    try { return await translateServer(text, from, to); }\n    catch (e) { if (from === 'ja' || to === 'ja') return translateFree(text, from, to); throw e; }\n  }\n  return translateFree(text, from, to);\n}")
          rep("return { text: j.translation, read: to === 'vi' ? (j.reading || '') : '' };",
              "return { text: j.translation, read: (to === 'vi' || to === 'ja') ? (j.reading || '') : '' };", False)
          rep("  if (lang === 'ko') return RE_HANGUL.test(t) && !RE_KANA.test(t);\n  if (lang === 'vi' || lang === 'en')",
              "  if (lang === 'ko') return RE_HANGUL.test(t) && !RE_KANA.test(t);\n  if (lang === 'ja') return (RE_KANA.test(t) || RE_HAN.test(t)) && !RE_HANGUL.test(t);\n  if (lang === 'vi' || lang === 'en')")
          rep("const MM_LOCALE = { ko: 'ko-KR', vi: 'vi-VN', en: 'en-US' };",
              "const MM_LOCALE = { ko: 'ko-KR', vi: 'vi-VN', en: 'en-US', ja: 'ja-JP' };")
          rep("const showRead = S.showRead && d.read && d.to === 'vi';",
              "const showRead = S.showRead && d.read && (d.to === 'vi' || d.to === 'ja');", False)
          rep("const showRead = S.showRead && h.read && h.to === 'vi';",
              "const showRead = S.showRead && h.read && (h.to === 'vi' || h.to === 'ja');", False)
          rep('여행 회화체와 베트남어 한글 발음을 지원합니다.',
              '여행 회화체와 베트남어·일본어 음성 읽기를 지원합니다.', False)

          # Avoid showing Vietnamese phrases under the Japanese selector in the offline phrasebook.
          rep("const t = target === 'en' ? p.en : p.vi;",
              "const t = target === 'ja' ? '일본어 문장집은 번역 탭에서 바로 번역해 사용할 수 있어요' : (target === 'en' ? p.en : p.vi);", False)
          rep("speak(target === 'en' ? p.en : p.vi, target);",
              "if (target === 'ja') { setStatus('일본어 문장은 번역 탭에서 입력해 주세요'); return; }\n      speak(target === 'en' ? p.en : p.vi, target);", False)

          p.write_text(s, encoding='utf-8')
          if "ja: { name: '日本語'" not in s or "ja-JP" not in s:
              raise SystemExit('Japanese patch verification failed')
          PY

      - name: Build installable debug APK
        shell: bash
        run: |
          cd androidapp
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../yeohaeng-translator-ja.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yeohaeng-translator-ja-apk
          path: yeohaeng-translator-ja.apk
          retention-days: 7
